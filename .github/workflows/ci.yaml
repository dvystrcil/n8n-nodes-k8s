# Tests for every PR and push, on this repo's own ARC runner
# (n8n-nodes-k8s-runner), with one exception that protects the cluster:
#
#   A pull request whose head is in ANOTHER repository (a fork of this public
#   repo) runs on GitHub-hosted ubuntu-latest instead. Its code is untrusted
#   and must never execute on a self-hosted runner inside the cluster (the
#   build runners are privileged Docker-in-Docker pods).
#
# Also: repo setting "require approval for all external contributors" is on,
# this workflow has read-only permissions and uses no secrets, and nothing
# here uses pull_request_target. The Harbor image build (build.yaml) runs for
# pushes to main only.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'n8n-nodes-k8s-runner' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'   # = the live n8n's Node
      # npm ci: exactly the lockfile (integrity-checked), no install scripts.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      # The tests run with an empty TMPDIR, and anything they leave in it fails the step: leaked test dirs once filled
      # a laptop's /tmp inodes. The action also reads every .py/.sh for a mktemp/mkdtemp nobody removes.
      # https://github.com/dvystrcil/tmp-cleanup-action
      - name: Unit tests (against the built dist/), leaving no temp dirs
        uses: dvystrcil/tmp-cleanup-action@v1
        with:
          test-command: set -o pipefail; npm test 2>&1 | tee test.out
          test-ignore: node-compile-cache   # Node's own cache: one dir, reused, not a leak
      - name: Assert the unit tests ran and passed
        run: |
          grep -Eq '^ℹ fail 0$' test.out
          grep -Eq '^ℹ pass [1-9][0-9]*$' test.out
      # Dependency gate (fail-closed): the shipped tree must match
      # deps-baseline.json exactly. A dependency bump fails here until it is
      # re-baselined with `npm run audit:deps -- --update` in the same PR,
      # which puts the capability diff in front of the reviewer. Audits the
      # production tree only, as shipped.
      - name: Dependency gate (network/exec/fs/env, licences, install scripts, description lint)
        run: |
          set -o pipefail
          rm -rf node_modules && npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node scripts/audit-deps.mjs | tee audit.out
          grep -qx 'DEPS-AUDIT-OK' audit.out

  mutation:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'n8n-nodes-k8s-runner' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Runs as a docker build stage: on our runner that executes in the DinD
      # sidecar (4 CPU / 16Gi), not the 512Mi job container, which Stryker
      # outgrows. --no-cache-filter so it really re-runs every time.
      - name: Mutation test (Stryker, break at 90%)
        run: |
          set -o pipefail
          docker build --target mutation --no-cache-filter mutation --progress=plain . 2>&1 | tee mutation.out
          grep -q 'is greater than or equal to break threshold' mutation.out

  e2e:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'n8n-nodes-k8s-runner' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The e2e driver is a Node script; the ARC runner image has no Node.
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
      - name: Build the node-only image
        run: docker build -t n8n-nodes-k8s:ci .
      - name: Install kind
        # No sudo: the ARC runner image does not need to have it.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kind" https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          command -v kubectl >/dev/null || { curl -fsSLo "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl"; chmod +x "$RUNNER_TEMP/bin/kubectl"; }
      - name: Create a kind cluster
        run: kind create cluster --name e2e --image kindest/node:v1.36.4 --kubeconfig "$RUNNER_TEMP/kind.kubeconfig" --wait 120s
      # Stock n8n with the image's files in N8N_CUSTOM_EXTENSIONS runs real
      # workflows against a narrow Role and an admission policy.
      - name: End to end (stock n8n, kind, minted token, verified TLS)
        run: |
          set -o pipefail
          node test/e2e/e2e.mjs --image n8n-nodes-k8s:ci --cluster e2e --kubeconfig "$RUNNER_TEMP/kind.kubeconfig" | tee e2e.out
          grep -qx 'E2E-OK' e2e.out
      - name: Delete the kind cluster
        if: always()
        run: kind delete cluster --name e2e --kubeconfig "$RUNNER_TEMP/kind.kubeconfig"
