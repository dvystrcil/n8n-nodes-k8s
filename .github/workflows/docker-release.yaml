# Promote an image to semver release tags when a GitHub release is published.
# No rebuild: re-tag the :sha-<commit> that build.yaml pushed and checked for
# the RELEASED commit (not whatever :dev points at by now), to {{version}} and
# {{major}}.{{minor}}. No `v` prefix on image tags: git tag v0.3.0 -> 0.3.0.

name: docker-release

on:
  release:
    types: [published]

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local
  PROJECT: ai
  IMAGE_NAME: n8n-nodes-k8s

jobs:
  promote:
    runs-on: n8n-nodes-k8s-runner
    permissions:
      contents: read
      id-token: write
    steps:
      # One named secret per step, never the whole store.
      - name: Fetch the Harbor username
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: HB_USERNAME
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Fetch the Harbor password
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: HB_PASSWORD
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Assert every scoped secret arrived
        run: |
          for v in HB_USERNAME HB_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v not fetched — renamed in Infisical?"; exit 1; }
          done

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.INTERNAL_REGISTRY }}
          username: ${{ env.HB_USERNAME }}
          password: ${{ env.HB_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor-core.harbor.svc.cluster.local"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Promote the released commit's image
        env:
          RELEASE_SHA: ${{ github.sha }}   # a release event's sha is the tagged commit
        run: |
          set -euo pipefail
          SRC=${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:sha-${RELEASE_SHA}
          docker buildx imagetools inspect "$SRC" >/dev/null
          for TAG in $(jq -cr '[.tags[]] | unique | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools create -t "$TAG" "$SRC"
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # homelab#2320: merge = release = deploy. After promote (the tag must exist
  # in Harbor), release-action's deploy step moves the newTag of
  # harbor.sirddail.net/ai/n8n-nodes-k8s in dvystrcil/n8n-workflow: newTag lines only, every
  # kustomize root rendered before/after (image-only diff), never a
  # downgrade, a major goes to a PR, retried if main moves.
  #
  # Kill switch: repo variable AUTO_DEPLOY. `false` opens one PR
  # (deploy/n8n-nodes-k8s-<ver>) instead of committing; committing to main needs the
  # CICD App as a bypass actor on n8n-workflow's ruleset.
  deploy:
    needs: promote
    runs-on: n8n-nodes-k8s-runner
    permissions:
      contents: read
      id-token: write
    # One deploy at a time; a pending newer release replaces an older pending
    # one. An older release that loses a race finds main past it (noop).
    concurrency:
      group: deploy-dvystrcil/n8n-workflow
      cancel-in-progress: false
    steps:
      # One named secret per step, never the whole store.
      - name: Fetch CICD_APP_CLIENT_ID from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: CICD_APP_CLIENT_ID
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Fetch CICD_APP_PRIVATE_KEY from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: CICD_APP_PRIVATE_KEY
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Generate app token
        # The CICD GitHub App, scoped to the repo it writes.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ env.CICD_APP_CLIENT_ID }}
          private-key: ${{ env.CICD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: n8n-workflow

      - name: Deploy to n8n-workflow
        id: deploy
        uses: dvystrcil/release-action@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          create-release: false
          version: ${{ github.event.release.tag_name }}
          deploy-repo: dvystrcil/n8n-workflow
          deploy-images: harbor.sirddail.net/ai/n8n-nodes-k8s
          auto-deploy: ${{ vars.AUTO_DEPLOY }}

      - run: echo "deploy-result=${{ steps.deploy.outputs.deploy-result }}"
