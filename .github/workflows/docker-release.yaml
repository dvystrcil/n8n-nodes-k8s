# Promote an image to semver release tags when a GitHub release is published.
# No rebuild: re-tag the :sha-<commit> that build.yaml pushed and checked for
# the RELEASED commit (not whatever :dev points at by now), to {{version}} and
# {{major}}.{{minor}}. No `v` prefix on image tags: git tag v0.3.0 -> 0.3.0.

name: docker-release

on:
  release:
    types: [published]

env:
  INTERNAL_REGISTRY: harbor-core.harbor.svc.cluster.local
  PROJECT: ai
  IMAGE_NAME: n8n-nodes-k8s

jobs:
  promote:
    runs-on: n8n-nodes-k8s-runner
    permissions:
      contents: read
      id-token: write
    steps:
      # One named secret per step, never the whole store.
      - name: Fetch the Harbor username
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: HB_USERNAME
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Fetch the Harbor password
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          secret-name: HB_PASSWORD
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Assert every scoped secret arrived
        run: |
          for v in HB_USERNAME HB_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v not fetched — renamed in Infisical?"; exit 1; }
          done

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.INTERNAL_REGISTRY }}
          username: ${{ env.HB_USERNAME }}
          password: ${{ env.HB_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor-core.harbor.svc.cluster.local"]
              ca=["/etc/ssl/certs/ca-certificates.crt"]

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Promote the released commit's image
        env:
          RELEASE_SHA: ${{ github.sha }}   # a release event's sha is the tagged commit
        run: |
          set -euo pipefail
          SRC=${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:sha-${RELEASE_SHA}
          docker buildx imagetools inspect "$SRC" >/dev/null
          for TAG in $(jq -cr '[.tags[]] | unique | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools create -t "$TAG" "$SRC"
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ env.INTERNAL_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
